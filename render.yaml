services:
  # Backend Web Service
  - type: web
    name: catchshield-backend
    env: python
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: catchshield-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      
  # Frontend Static Site
  - type: web
    name: catchshield-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
    routes:
      - type: rewrite
        source: "/api/*"
        destination: "https://catchshield-backend.onrender.com/api/*"
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  - name: catchshield-db
    databaseName: catchshield
    user: catchshield_user
    region: oregon
    plan: free
